<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AmiLingo 岗位与公司风险信号检查">
  <title>AmiLingo · 岗位风险检查</title>
  <link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="返回岗位发现页">
      <span class="brand-mark">A</span>
      <span>AmiLingo</span>
    </a>
    <nav class="topbar-nav" aria-label="就业模块导航">
      <a href="./index.html">返回岗位列表</a>
      <a href="./profile.html">求职资料助手</a>
    </nav>
  </header>

  <main>
    <section class="risk-intro">
      <div class="risk-intro-card">
        <p class="section-kicker">Transparent checks</p>
        <h1>岗位风险检查</h1>
        <p>根据你已经掌握的客观信息，整理值得核实的风险信号。系统会解释每项判断依据，而不是简单地给企业贴上“靠谱”或“不靠谱”的标签。</p>
      </div>
      <div class="risk-intro-card">
        <ul class="risk-principles">
          <li>新公司或小团队不会被自动判为高风险</li>
          <li>付费招聘、过早索取敏感资料会被重点提示</li>
          <li>结果提供核实清单，最终信息以官方资料为准</li>
        </ul>
      </div>
    </section>

    <section class="risk-layout">
      <form id="risk-form" class="risk-form-card">
        <h2>填写已知信息</h2>
        <p class="form-hint">不知道的项目可以选择“不确定”，系统不会擅自补全。</p>

        <div class="form-grid">
          <label class="full">公司名称
            <input id="company-name" name="companyName" maxlength="128" required placeholder="例如：Example Technology Limited">
          </label>
          <label>成立日期
            <input id="registration-date" name="registrationDate" type="date">
          </label>
          <label>公开员工人数
            <input id="employee-count" name="employeeCount" type="number" min="0" placeholder="不知道可留空">
          </label>
          <label>登记资本
            <input id="capital-amount" name="registeredCapitalAmount" type="number" min="0" step="0.01" placeholder="不知道可留空">
          </label>
          <label>币种
            <input id="capital-currency" name="registeredCapitalCurrency" maxlength="16" placeholder="如 CNY / HKD / MOP">
          </label>
        </div>

        <fieldset class="question-group">
          <legend>招聘与企业信息</legend>
          <div class="question-list">
            <label class="question-row"><span>办公地址可以与企业登记或地图信息相互核对吗？</span><select id="verified-address"><option value="">不确定</option><option value="true">可以</option><option value="false">不可以</option></select></label>
            <label class="question-row"><span>能找到企业官网或认证的官方招聘主页吗？</span><select id="official-website"><option value="">不确定</option><option value="true">可以</option><option value="false">不可以</option></select></label>
            <label class="question-row"><span>岗位职责、工作地点和工作时间是否清楚？</span><select id="clear-description"><option value="">不确定</option><option value="true">清楚</option><option value="false">不清楚</option></select></label>
            <label class="question-row"><span>薪资、试用期和福利是否提供书面说明？</span><select id="written-terms"><option value="">不确定</option><option value="true">有</option><option value="false">没有</option></select></label>
            <label class="question-row"><span>招聘方是否要求支付培训费、押金或保证金？</span><select id="applicant-fees"><option value="">不确定</option><option value="false">没有</option><option value="true">有</option></select></label>
            <label class="question-row"><span>正式录用前是否索取银行卡、验证码或证件原件？</span><select id="sensitive-data"><option value="">不确定</option><option value="false">没有</option><option value="true">有</option></select></label>
            <label class="question-row"><span>是否全程只通过私人聊天账号联系？</span><select id="personal-messaging"><option value="">不确定</option><option value="false">不是</option><option value="true">是</option></select></label>
            <label class="question-row"><span>薪资是否明显高于同类岗位但几乎没有要求？</span><select id="unusual-salary"><option value="">不确定</option><option value="false">不是</option><option value="true">是</option></select></label>
          </div>
        </fieldset>

        <button id="risk-submit" class="primary-button submit-risk" type="submit">生成核验结果</button>
      </form>

      <aside id="risk-result" class="risk-result empty" aria-live="polite">
        <div id="risk-placeholder">
          <span class="detail-icon">?</span>
          <h2>等待填写</h2>
          <p>提交后，这里会显示风险分数、解释和核实清单。</p>
        </div>
        <div id="risk-content" hidden>
          <h2 id="result-company"></h2>
          <div id="score-ring" class="score-ring"><strong id="risk-score"></strong></div>
          <p id="risk-level" class="risk-level"></p>
          <div class="result-section">
            <h3>发现的信号</h3>
            <ul id="signal-list" class="signal-list"></ul>
          </div>
          <div class="result-section">
            <h3>下一步核实</h3>
            <ul id="verification-list" class="checklist"></ul>
          </div>
          <p id="risk-disclaimer" class="risk-disclaimer"></p>
        </div>
      </aside>
    </section>
  </main>

  <script src="./risk.js?v=1"></script>
</body>
</html>
