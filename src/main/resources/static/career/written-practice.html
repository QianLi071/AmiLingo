<body><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">A</span><span>AmiLingo</span></a><nav class="topbar-nav"><a href="./index.html">岗位列表</a><a href="./interviews.html">面试复盘</a><a href="./profile.html">求职资料助手</a><a href="../club/">校园探索</a></nav></header>
<main><section class="profile-hero"><div><p class="section-kicker">Original written practice</p><h1>原创笔试练习</h1><p>按岗位方向练习分析和表达，每道题附有透明检查标准。题目不是企业真题，也不代表任何公司的考试范围。</p></div><div class="privacy-card"><strong>先练方法，不背答案</strong><span>作答和自检记录仅保存在当前浏览器。</span></div></section>
<section class="interview-layout"><aside class="session-sidebar"><form id="written-form" class="session-form"><h2>新建练习</h2><label>公司<input id="written-company" maxlength="128" placeholder="可选"></label><label>目标岗位 *<input id="written-position" maxlength="128" required></label><label>练习方向<select id="written-track"><option value="GENERAL">通用分析</option><option value="SOFTWARE">软件与算法</option><option value="DATA">数据分析</option><option value="PRODUCT">产品与业务</option><option value="HARDWARE">硬件与工程</option></select></label><button class="primary-button" type="submit">生成原创练习</button></form><div class="session-heading"><h2>练习记录</h2><span id="written-count"></span></div><div id="written-session-list" class="session-list"></div></aside>
<section class="interview-workspace"><div id="written-empty" class="interview-empty"><span class="detail-icon">✎</span><h2>选择或新建一组练习</h2><p>从岗位详情进入时，系统会尝试匹配练习方向，你仍可手动选择。</p></div><div id="written-content" hidden><div class="interview-title"><div><p id="written-meta" class="section-kicker"></p><h2 id="written-title"></h2></div><button id="written-delete" class="danger-button" type="button">删除</button></div><p class="interview-note">先独立作答，再按标准逐项检查。勾选只表示“答案中已经覆盖”，不等于答案一定正确。</p><div id="written-question-list" class="question-list"></div><section class="review-panel"><h3>练习进度与薄弱点</h3><div id="written-review"></div></section></div></section></section><p id="written-status" class="form-status" role="status"></p></main>
<script src="./written-practice-store.js?v=1"></script><script src="./written-practice.js?v=1"></script></body></html>
