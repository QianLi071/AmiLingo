server:
  port: 8080
  tomcat:
    max-connections: 65535
    threads:
      max: 1000
    accept-count: 1600

spring:
  application:
    name: platform
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: ${DATABASE_HOST:jdbc:mysql://localhost:3306/amilingo}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:}
      port: ${REDIS_PORT:6379}
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          min-idle: 0
          max-idle: 4

microservice:
  workerid: ${WORKER_ID:0}
  dadacenterid: ${DATACENTER_ID:0}

# JWT 签名密钥：必须通过环境变量 JWT_SECRET 注入至少 32 字节的随机字符串。
# 生成方式：openssl rand -base64 48 或 uuidgen | sha256sum
# 切勿把真实密钥提交到代码仓库。
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# 应用层安全配置（登录安全机制 / 统一验证码模块 / 短信供应商）
app:
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Amilingo}
  sms:
    # 短信供应商实现：
    #   log  = 开发环境桩（验证码仅输出服务端日志，⚠️ 严禁生产使用）
    #   生产环境接入真实供应商后，新增 SmsSender 实现并切换为对应值使桩自动退让
    provider: ${SMS_PROVIDER:log}
  security:
    # 登录安全：陌生设备/位置的邮箱二次验证
    login:
      # 二次验证挑战（challenge）有效期（秒）
      challenge-ttl-seconds: ${LOGIN_CHALLENGE_TTL:300}
      # 单个挑战允许的验证码错误次数，超过即作废挑战（需重新密码登录）
      max-verify-attempts: ${LOGIN_MAX_VERIFY_ATTEMPTS:5}
      # 受信任设备指纹滚动有效期（天）与每用户最大记忆设备数
      trust-ttl-days: ${LOGIN_TRUST_TTL_DAYS:30}
      trust-max-devices: ${LOGIN_TRUST_MAX_DEVICES:5}
    # 统一验证码模块（登录二次验证 / 手机号登录 / 邮箱·手机号绑定共用）
    verify-code:
      ttl-seconds: ${VERIFY_CODE_TTL:300}
      length: ${VERIFY_CODE_LENGTH:6}
      # 同一目标的验证码发送冷却秒数（防轰炸）
      resend-cooldown-seconds: ${VERIFY_CODE_COOLDOWN:60}
      # 单个验证码允许的错误次数，超过即作废（需重新发送）
      max-verify-attempts: ${VERIFY_CODE_MAX_ATTEMPTS:5}

# AI 能力配置
# ai.provider 选择 AiGateway 实现：
#   deepseek（默认，无需本地模型/ Python，直接走云端 DeepSeek，适合 models/llama.cpp 留空时）
#   python（走本地 OfflineAssistant FastAPI → llama.cpp，需要模型与 Python 服务在线）
#   noop（桩实现，全部不可用）
ai:
  # 默认走本地 llama.cpp 小模型（Gemma 4 E2B + Qwen3-Embedding）；
  # 需要云端模型时设置环境变量 AI_PROVIDER=deepseek
  provider: ${AI_PROVIDER:python}
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # DeepSeek API key 强制从环境变量 DEEPSEEK_API_KEY 读取；
    # 本地开发请在系统环境变量中配置，或在 IDE 启动配置中注入。
    # 切勿把 key 提交到代码仓库。
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    connect-timeout: 5000
    read-timeout: 360000
  # 本地离线 AI：FastAPI 编排层（图片评分等业务端点）+ 两个 llama-server
  python:
    # FastAPI（OfflineAssistant）：图片作文识别+评分等编排接口
    base-url: ${AI_PYTHON_BASE_URL:http://127.0.0.1:8000}
    # llama-server 对话/评分（Gemma 4 E2B，含 --mmproj 多模态）
    llm-base-url: ${AI_LLM_BASE_URL:http://127.0.0.1:8081}
    # llama-server 向量（Qwen3-Embedding-0.6B）
    embedding-base-url: ${AI_EMBEDDING_BASE_URL:http://127.0.0.1:8082}
    chat-model: ${AI_CHAT_MODEL:local-gemma}
    embed-model: ${AI_EMBED_MODEL:local-qwen-embed}
    read-timeout: 600000
    # 范文库与向量缓存（与原版 Python OfflineAssistant 共用，缓存指纹一致可直接复用）
    essays-dir: ${AI_ESSAYS_DIR:src/main/python/OfflineAssistant/backend/data/essays}
    vector-cache-dir: ${AI_VECTOR_CACHE_DIR:src/main/python/OfflineAssistant/backend/data/vector_store}

