server:
  port: 8080

spring:
  application:
    name: platform
  datasource:
    url: jdbc:h2:mem:amilingo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true       # 开发期可访问 /h2-console 查看数据
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update    # 启动时自动建/更新表结构
    show-sql: false
    properties:
      hibernate:
        format_sql: true
